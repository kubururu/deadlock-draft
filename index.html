<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Team Draft</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <style>
        /* Niestandardowy Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e24;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #0a0a0a;
            color: white;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background-color: #121212;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            z-index: 10;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1.1rem;
            font-weight: bold;
            color: #d1d1d1;
        }

        .menu-btn:hover {
            background-color: #2a2a2a;
            color: white;
        }

        .menu-btn .icon {
            margin-right: 15px;
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-half {
            flex: 2;
            display: flex;
            border-bottom: 3px solid #000;
        }

        .team-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Tła */
        #hidden-king {
            background: #2a1b1b url('bg_hidden_king.jpg') center/cover no-repeat;
            background-blend-mode: overlay;
            border-right: 3px solid #000;
        }

        #archmother {
            background: #1b1b2a url('bg_archmother.jpg') center/cover no-repeat;
            background-blend-mode: overlay;
        }

        .bottom-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #1b2a1b url('bg_spectator.jpg') center/cover no-repeat;
            background-blend-mode: overlay;
        }

        /* --- TYTUŁY (Obrazki) --- */
        .title-img {
            max-height: 60px;
            margin: 20px auto;
            display: block;
            background-color: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: white;
            alt: attr(alt);
        }

        /* --- DROPZONY I GRACZE --- */
        .dropzone {
            flex: 1;
            padding: 20px;
            display: flex;
            align-content: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            overflow-y: auto;
        }

        .player-token {
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid #555;
            
            /* Dokładne wyliczenie szerokości: 6 elementów w rzędzie */
            flex: 0 0 calc((100% - 50px) / 6);
            max-width: calc((100% - 50px) / 6);
            
            padding: 18px 5px;
            border-radius: 8px;
            cursor: grab;
            font-weight: bold;
            font-size: 19px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
            
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-token:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        
        .player-token.captain {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }

        .player-token.captain::before {
            content: '⭐';
            font-size: 1.2rem;
        }

        /* --- MODALE --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1e1e24; 
            color: #f0f0f0;
            width: 700px;
            height: 500px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 40px 30px 30px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            position: relative;
            border: 1px solid #333;
        }

        .modal-close {
            position: absolute;
            top: 5px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            transition: color 0.2s;
            z-index: 10;
        }
        
        .modal-close:hover { color: #fff; }

        .players-list-container {
            flex: 1;
            background: #2a2a32;
            border: 1px solid #444;
            padding: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-radius: 6px;
        }

        /* Modyfikacja dla elementów listy z przyciskiem usuwania */
        .players-list-item {
            padding: 12px;
            background: #3a3a44;
            border-radius: 4px;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .players-list-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #ff1a1a;
        }

        .modal-footer {
            display: flex;
            gap: 20px;
            border-top: 2px solid #444;
            padding-top: 20px;
        }

        .input-box {
            flex: 1;
            border: 2px solid #555;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            outline: none;
            background: #2a2a32;
            color: #fff;
            border-radius: 6px;
        }
        
        .input-box:focus {
            border-color: #777;
        }

        .btn-box {
            border: 2px solid #555;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #3a3a44;
            color: #fff;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .btn-box:hover { background: #4a4a56; }

        .captains-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #444;
            padding-top: 20px;
            margin-top: auto;
        }

        .captain-slot {
            font-size: 24px;
            font-weight: bold;
            flex: 1;
            text-align: center;
            color: #ffd700;
        }

        /* Modal: Coinflip */
        .coinflip-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .coin-wrapper {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coin {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: transparent;
            background-image: url('orzel.png'); /* Defaultowo Orzeł */
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
        }

        .coin-wrapper.toss-up {
            animation: tossAnim 2s cubic-bezier(0.3, 0.8, 0.5, 1);
        }

        .coin.spin-fast {
            animation: spinYAnim 0.3s linear infinite;
        }

        @keyframes tossAnim {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-120px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes spinYAnim {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        #coin-result-text {
            height: 40px;
            margin-top: 30px;
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .coin-footer {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            border-top: 2px solid #444;
            padding-top: 20px;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="menu-btn" onclick="openModal('modal-add')">
            <span class="icon">✏️</span> dodaj zawodników
        </div>
        <div class="menu-btn" onclick="openModal('modal-captains')">
            <span class="icon">🎲</span> wylosuj kapitanów
        </div>
        <div class="menu-btn" onclick="openModal('modal-coinflip')">
            <span class="icon">🪙</span> coin flip
        </div>
        <div class="menu-btn" onclick="resetDraft()" style="margin-top: auto;">
            <span class="icon">🔄</span> reset
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-half">
            <!-- Hidden King -->
            <div class="team-section" id="hidden-king">
                <img src="title_hidden_king.png" class="title-img" alt="hidden king" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="title-img" style="display:none;">hidden king</div>
                <div class="dropzone" id="drop-hk" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>

            <!-- Archmother -->
            <div class="team-section" id="archmother">
                <img src="title_archmother.png" class="title-img" alt="archmother" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="title-img" style="display:none;">archmother</div>
                <div class="dropzone" id="drop-am" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </div>

        <div class="bottom-half" id="spectator">
            <div class="dropzone" id="drop-spec" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <!-- OVERLAYS / MODALS -->
    
    <!-- Modal: Dodaj zawodników -->
    <div class="modal-overlay" id="modal-add" onclick="closeOnOutside(event)">
        <div class="modal-box">
            <div class="modal-close" onclick="closeModal('modal-add')">&times;</div>
            <div class="players-list-container" id="added-players-list">
                <!-- Lista graczy w modalu -->
            </div>
            <div class="modal-footer">
                <input type="text" id="player-input" class="input-box" placeholder="" onkeypress="handleEnter(event)">
                <button class="btn-box" onclick="addPlayer()">dodaj</button>
            </div>
        </div>
    </div>

    <!-- Modal: Wylosuj kapitanów -->
    <div class="modal-overlay" id="modal-captains" onclick="closeOnOutside(event)">
        <div class="modal-box">
            <div class="modal-close" onclick="closeModal('modal-captains')">&times;</div>
            <div class="players-list-container" id="available-players-list">
                <!-- Lista dostępnych graczy -->
            </div>
            <div class="captains-footer">
                <div class="captain-slot" id="cap1-slot"></div>
                <div class="captain-slot" id="cap2-slot"></div>
                <button class="btn-box" onclick="drawCaptains()">losuj</button>
            </div>
        </div>
    </div>

    <!-- Modal: Coin flip -->
    <div class="modal-overlay" id="modal-coinflip" onclick="closeOnOutside(event)">
        <div class="modal-box" style="width: 500px; height: 550px;">
            <div class="modal-close" onclick="closeModal('modal-coinflip')">&times;</div>
            <div class="coinflip-content-wrapper">
                <div class="coin-wrapper" id="coin-wrapper">
                    <div class="coin" id="coin-element"></div>
                </div>
                <div id="coin-result-text"></div>
            </div>
            <div class="coin-footer">
                <button class="btn-box" style="width: 200px; text-align: center;" onclick="flipCoin()">rzuć</button>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let playerCounter = 0;
        let isFlipping = false;
        let swapInterval = null;

        // --- Obsługa Modali ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            
            if (id === 'modal-add') {
                document.getElementById('player-input').focus();
            }
            
            if (id === 'modal-coinflip') {
                const coin = document.getElementById('coin-element');
                const wrapper = document.getElementById('coin-wrapper');
                
                coin.classList.remove('spin-fast');
                wrapper.classList.remove('toss-up');
                
                coin.style.transform = 'rotateY(0deg)';
                coin.style.backgroundImage = "url('orzel.png')";
                
                document.getElementById('coin-result-text').innerText = '';
                isFlipping = false;
                if(swapInterval) clearInterval(swapInterval);
            }
            
            updateModalLists();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function closeOnOutside(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // --- Logika Graczy ---
        function handleEnter(e) {
            if(e.key === 'Enter') addPlayer();
        }

        function addPlayer() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            if(!name) return;

            const playerId = 'player-' + playerCounter++;
            players.push({ id: playerId, name: name, isCaptain: false });
            
            const token = document.createElement('div');
            token.className = 'player-token';
            token.id = playerId;
            token.draggable = true;
            token.innerText = name;
            token.ondragstart = drag;
            
            document.getElementById('drop-spec').appendChild(token);

            input.value = '';
            input.focus();
            updateModalLists();
        }

        function removePlayer(playerId) {
            // Usunięcie z tablicy w kodzie
            players = players.filter(p => p.id !== playerId);
            
            // Usunięcie div-a (tokenu) gracza z głównej mapy
            const tokenElement = document.getElementById(playerId);
            if (tokenElement) {
                tokenElement.remove();
            }
            
            // Odświeżenie list w modalach
            updateModalLists();
        }

        function updateModalLists() {
            const addList = document.getElementById('added-players-list');
            const capList = document.getElementById('available-players-list');
            
            addList.innerHTML = '';
            capList.innerHTML = '';

            players.forEach(p => {
                // Generowanie w "Dodaj zawodników" (Z przyciskiem usuwania)
                const itemAdd = document.createElement('div');
                itemAdd.className = 'players-list-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = p.name;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Usuń zawodnika';
                delBtn.onclick = () => removePlayer(p.id);
                
                itemAdd.appendChild(nameSpan);
                itemAdd.appendChild(delBtn);
                addList.appendChild(itemAdd);
                
                // Generowanie w "Wylosuj kapitanów" (Bez przycisku usuwania)
                const itemCap = document.createElement('div');
                itemCap.className = 'players-list-item';
                itemCap.innerText = p.name;
                capList.appendChild(itemCap);
            });
        }

        function drawCaptains() {
            if (players.length < 2) {
                alert("Potrzebujesz co najmniej 2 graczy!");
                return;
            }

            players.forEach(p => p.isCaptain = false);
            document.querySelectorAll('.player-token').forEach(el => el.classList.remove('captain'));

            let idx1 = Math.floor(Math.random() * players.length);
            let idx2;
            do {
                idx2 = Math.floor(Math.random() * players.length);
            } while (idx1 === idx2);

            players[idx1].isCaptain = true;
            players[idx2].isCaptain = true;

            document.getElementById('cap1-slot').innerText = players[idx1].name;
            document.getElementById('cap2-slot').innerText = players[idx2].name;

            document.getElementById(players[idx1].id).classList.add('captain');
            document.getElementById(players[idx2].id).classList.add('captain');
        }

        // --- Rzut Monetą ---
        function flipCoin() {
            if(isFlipping) return;
            isFlipping = true;

            const coin = document.getElementById('coin-element');
            const wrapper = document.getElementById('coin-wrapper');
            const resultText = document.getElementById('coin-result-text');
            
            resultText.innerText = '';
            
            // Restart animacji
            coin.classList.remove('spin-fast');
            wrapper.classList.remove('toss-up');
            void coin.offsetWidth; 
            
            coin.classList.add('spin-fast');
            wrapper.classList.add('toss-up');

            // Cykliczna zmiana obrazka
            swapInterval = setInterval(() => {
                const currentBg = coin.style.backgroundImage;
                if (currentBg.includes('orzel')) {
                    coin.style.backgroundImage = "url('reszka.png')";
                } else {
                    coin.style.backgroundImage = "url('orzel.png')";
                }
            }, 150);

            const isHeads = Math.random() < 0.5;
            const resultImg = isHeads ? 'orzel.png' : 'reszka.png';
            const resultStr = isHeads ? 'ORZEŁ' : 'RESZKA';

            // Koniec rzutu
            setTimeout(() => {
                clearInterval(swapInterval);
                coin.classList.remove('spin-fast');
                wrapper.classList.remove('toss-up');
                
                coin.style.transform = 'rotateY(0deg)';
                coin.style.backgroundImage = `url('${resultImg}')`;
                
                resultText.innerText = resultStr;
                isFlipping = false;
            }, 2000); 
        }

        // --- Drag & Drop ---
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedEl = document.getElementById(data);
            
            const dropzone = ev.target.closest('.dropzone');
            if (dropzone && draggedEl) {
                dropzone.appendChild(draggedEl);
            }
        }

        // --- Reset ---
        function resetDraft() {
            players.forEach(p => p.isCaptain = false);
            const tokens = document.querySelectorAll('.player-token');
            const specDrop = document.getElementById('drop-spec');
            
            tokens.forEach(token => {
                token.classList.remove('captain');
                specDrop.appendChild(token);
            });

            document.getElementById('cap1-slot').innerText = '';
            document.getElementById('cap2-slot').innerText = '';
        }
    </script>
</body>
</html>
